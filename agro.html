<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgroVision AI – Grow Smarter. Harvest Better.</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAF7;--card:#fff;--ink:#1F2937;--mut:#566170;--line:#dfe6dd;--mint:#DCFCE7;--em:#16A34A;--btn:#15803d;--acc:#14532D;--sh:0 6px 24px rgba(20,83,45,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a11;--card:#14241a;--ink:#e6efe8;--mut:#9db3a4;--line:#274030;--mint:#1c3a26;--btn:#16a34a;--acc:#86efac;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a11;--card:#14241a;--ink:#e6efe8;--mut:#9db3a4;--line:#274030;--mint:#1c3a26;--btn:#16a34a;--acc:#86efac;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Noto Sans Devanagari",system-ui,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0 0 .4em;line-height:1.15}p{margin:.3em 0}
.bt{border:0;background:var(--btn);color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;transition:.2s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.bt:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(22,163,74,.35)}
.bt.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.bt.sm{padding:6px 12px;font-size:.85em}
input,select,textarea{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
label{font-weight:700;font-size:.85em;display:block;margin:8px 0 3px}
/* landing */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;padding:10px 20px;background:rgba(10,40,22,.72);backdrop-filter:blur(14px);color:#fff;flex-wrap:wrap}
.nav b{font-size:1.2em;margin-right:auto}.nav a{padding:6px 10px;border-radius:8px;font-weight:600;font-size:.92em}.nav a:hover{background:rgba(255,255,255,.15)}
.hero{position:relative;overflow:hidden;min-height:92vh;color:#fff;background:linear-gradient(160deg,#052e16,#14532D 55%,#0b3b1f);display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:60px 6vw 120px}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 12s ease-in-out infinite}
.farm{position:absolute;left:0;right:0;bottom:0;height:42%;perspective:500px;overflow:hidden}
.farm i{position:absolute;inset:0;transform:rotateX(64deg) scale(1.8);transform-origin:50% 100%;background:repeating-linear-gradient(90deg,#14532D 0 22px,#1b7a3d 22px 44px);opacity:.75;animation:rows 6s linear infinite}
.farm:after{content:"";position:absolute;inset:0;background:linear-gradient(#14532D 0%,transparent 60%)}
.hero h1 span{background:linear-gradient(90deg,#86efac,#fde047);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:1.15em;max-width:36em;opacity:.92}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.hero .bt.ghost{color:#fff;border-color:rgba(255,255,255,.6)}
.prev{position:relative;z-index:2;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(16px);border-radius:24px;padding:20px;transition:transform .15s;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.orbit{position:absolute;inset:-46px;border:1px dashed rgba(255,255,255,.4);border-radius:50%;animation:spin 14s linear infinite;pointer-events:none}
.orbit span{position:absolute;top:-14px;left:50%;font-size:1.7em}
.mini{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:12px 0;position:relative;overflow:hidden;border-radius:10px}
.mini i{aspect-ratio:1;border-radius:3px;animation:pulse 2.4s ease-in-out infinite}
.scan{position:absolute;left:0;right:0;height:14px;background:linear-gradient(transparent,rgba(255,255,255,.7),transparent);animation:scan 3s linear infinite;pointer-events:none}
.pm{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid rgba(255,255,255,.2);font-weight:700}
.tag{display:inline-block;font-size:.72em;font-weight:800;padding:2px 9px;border-radius:99px;background:#fef3c7;color:#78350f}
.tag.live{background:#bbf7d0;color:#14532D}
.sec{padding:70px 6vw}.sec h2{font-size:2em;text-align:center}.sec .sub{text-align:center;color:var(--mut);margin-bottom:30px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh);transition:.25s;position:relative;overflow:hidden;--x:50%;--y:50%}
.fc:before{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--x) var(--y),rgba(22,163,74,.22),transparent 60%);opacity:0;transition:.3s}
.fc:hover:before{opacity:1}.fc:hover{transform:translateY(-6px) rotate(-.5deg)}
.fc .ic{font-size:2.2em}
.arch{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:stretch}
.arch div{flex:1 1 150px;max-width:210px;padding:16px;border-radius:16px;color:#14301c;font-weight:700;animation:glow 5s ease-in-out infinite}
.arch small{display:block;font-weight:400;margin-top:4px}
.foot{background:#052e16;color:#cfe8d6;padding:40px 6vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.foot b{color:#fff}
/* app */
.app{display:flex;min-height:100vh}
.side{width:236px;background:#0f3d20;color:#e7f5ea;padding:14px 10px;display:flex;flex-direction:column;gap:3px;transition:width .25s;flex:none;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
.side a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;font-weight:600;white-space:nowrap}
.side a:hover{background:rgba(255,255,255,.1)}.side a.on{background:#16A34A;color:#fff}
.side .brand{padding:6px 10px 14px;font-size:1.05em}
.col .side{width:68px}.col .side em{display:none}
.main{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top select{width:auto;max-width:200px}
.page{padding:20px;max-width:1300px;animation:in .35s}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh);transition:.2s}
.card:hover{transform:translateY(-2px)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi b{font-size:2em;display:block;color:var(--acc)}.kpi span{color:var(--mut);font-weight:700}
.wx{display:flex;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg,#14532D,#16A34A);color:#fff;border-radius:18px;padding:16px 20px;margin-bottom:16px;align-items:center}
.wx div{min-width:90px}.wx b{font-size:1.4em;display:block}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.steps a{background:var(--mint);color:#14532D;font-weight:800;font-size:.8em;padding:5px 12px;border-radius:99px}
.steps a:hover{background:var(--em);color:#fff}
.map{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;position:relative;overflow:hidden;border-radius:12px}
.cell{aspect-ratio:1;border:2px solid transparent;border-radius:5px;transition:.15s;padding:0}
.cell:hover{transform:scale(1.18);z-index:2;border-color:#fff}.cell.on{border-color:#111;transform:scale(1.15)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:.8em;font-weight:700;margin-top:8px}.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.chart svg{width:100%;touch-action:none}.tip{font-size:.8em;font-weight:700;color:var(--mut);min-height:1.4em}
.xl{display:flex;justify-content:space-between;font-size:.7em;color:var(--mut)}
.bars{display:flex;gap:6px;align-items:flex-end;height:150px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.75em;font-weight:800}
.bcol i{width:100%;border-radius:8px 8px 0 0;min-height:4px;transition:height .6s}.bcol:hover i{filter:brightness(1.15)}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row>*:first-child{flex:1}
.pill{padding:2px 10px;border-radius:99px;font-size:.75em;font-weight:800;color:#fff;display:inline-block}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:2px solid var(--line);background:var(--card);padding:8px 16px;border-radius:99px;font-weight:800}.tabs .on{background:var(--btn);color:#fff;border-color:var(--btn)}
table{width:100%;border-collapse:collapse;font-size:.92em}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}tr.sel{background:var(--mint)}tbody tr{cursor:pointer}
.sk{height:150px;background:linear-gradient(90deg,var(--line),var(--mint),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--card);border-radius:20px;padding:22px;max-width:480px;width:100%;max-height:88vh;overflow:auto}
.chat{height:420px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-line}
.msg.u{align-self:flex-end;background:var(--btn);color:#fff}.msg.a{background:var(--mint);color:#14301c}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chips button{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:700}
.chips button:hover{border-color:var(--em)}
.stp{display:flex;gap:4px;margin-top:6px}.stp span{flex:1;text-align:center;font-size:.7em;font-weight:800;padding:4px;border-radius:8px;background:var(--line)}.stp .d{background:var(--em);color:#fff}
.err{background:#fee2e2;color:#7f1d1d;padding:8px 12px;border-radius:10px;margin-top:8px;font-weight:700}
.okk{background:#dcfce7;color:#14532D;padding:8px 12px;border-radius:10px;margin-top:8px;font-weight:700}
@keyframes float{50%{transform:translate(30px,-30px)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rows{to{background-position:44px 0}}@keyframes pulse{50%{opacity:.55}}@keyframes scan{from{top:-14px}to{top:100%}}
@keyframes glow{50%{box-shadow:0 0 28px rgba(134,239,172,.8)}}@keyframes sh{to{background-position:-200% 0}}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-bottom:140px}}
@media (max-width:700px){.app{flex-direction:column}.side{width:auto;height:auto;flex-direction:row;overflow-x:auto;position:static}.side em,.side .brand{display:none}.col .side{width:auto}.page{padding:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script>

const NAV=[['overview','Overview','🏠'],['fields','My Fields','🗺️'],['ndvi','NDVI Health Monitor','🛰️'],['disease','Disease Risk','🦠'],['yield','Yield Prediction','🌾'],['water','Smart Irrigation','💧'],['market','Market Prices','📈'],['buyers','Buyer Connect','🤝'],['chat','AI Farmer Assistant','🎙️'],['settings','Settings','⚙️']];
const DATES=['2026-09-27','2026-10-04','2026-10-11'];
const frac=x=>x-Math.floor(x),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const nd=(f,d,i)=>+Math.max(.12,Math.min(.88,.42+.4*frac(Math.sin(i*12.9898+f*78.233)*43758.5453)+d*.03-(i%11==3?.18:0))).toFixed(2);

const trend=f=>[.41,.48,.55,.6,.64,.66,.63,.68].map(v=>+(v+(f-2)*.03).toFixed(2));
const WK=['W1','W2','W3','W4','W5','W6','W7','W8'];

const rl=v=>v<25?'Low':v<50?'Moderate':v<70?'High':'Very High',rc=v=>v<25?'#16a34a':v<50?'#ca8a04':v<70?'#ea580c':'#dc2626';

const BASE={Potato:22,Wheat:3.4,Rice:4.1,Tomato:28},SF={Germination:.7,Vegetative:.85,Flowering:.95,'Grain filling':1,Fruiting:1};
const ycalc=(c,ac,stage='Vegetative')=>{const e=+(BASE[c]*(SF[stage]||.9)*1.0).toFixed(1);return{e,lo:+(e*.85).toFixed(1),hi:+(e*1.12).toFixed(1),tot:+(e*ac*.4047).toFixed(1)}};
const CROPS=['Potato','Wheat','Rice','Tomato'],STAGES=['Germination','Vegetative','Flowering','Fruiting','Grain filling'];
const MKTS=[['Demo Mandi 1',12],['Demo Mandi 2',28],['Demo Mandi 3',45],['Demo Mandi 4',70]];
const price=(c,m,i)=>Math.round((({Potato:1500,Wheat:2300,Rice:2100,Tomato:1800})[c]*(0.9+.05*i+.03*m))/10)*10;
const BUYERS=[['Demo Buyer A','Wholesaler','Potato, Wheat'],['Demo Buyer B','Retailer','Tomato'],['Demo Buyer C','Food processor','Potato'],['Demo Buyer D','Local buyer','Rice, Wheat'],['Demo Buyer E','Wholesaler','Rice']];
const TIPS={Potato:['Inspect lower leaves in the early morning for spots or water-soaked patches.','Improve air flow; avoid evening irrigation when humid weather is forecast.','Before any spray, ask your local agriculture officer which product is approved for your crop and area.'],Wheat:['Walk the field and check leaves for rust-coloured or yellow patches.','Avoid waterlogging near the field edges.','Confirm any treatment with your local agriculture officer.'],Rice:['Check for leaf spots on young leaves and keep water levels steady.','Avoid excess nitrogen when humid weather is forecast.','Ask your local agriculture officer before applying any product.'],Tomato:['Check for leaf spots and wilting in the morning.','Stake plants for air flow; water at the base, not on leaves.','Ask your local agriculture officer before using any treatment.']};
const LANGS={en:{n:'English',v:'en-IN'},hi:{n:'हिन्दी',v:'hi-IN'}};

/* ===== reusable UI ===== */
const Badge=({live})=>h('span',{className:'tag'+(live?' live':'')},live?'LIVE DATA':'SAMPLE DATA · not live');
function Count({to,dec=0,suf=''}){const[v,setV]=useState(0);useEffect(()=>{let r,t0;const f=t=>{t0=t0||t;const p=Math.min(1,(t-t0)/900);setV(to*p);if(p<1)r=requestAnimationFrame(f)};r=requestAnimationFrame(f);return()=>cancelAnimationFrame(r)},[to]);return v.toFixed(dec)+suf}

 useEffect(()=>{let off=false;set(null);const done=(d,live)=>!off&&set({d,live});
  if(API.base)fetch(API.base+API.ep[k]).then(r=>r.ok?r.json():Promise.reject()).then(d=>done(d,true)).catch(()=>done(fb,false));
  else setTimeout(()=>done(fb,false),300);return()=>{off=true}},[k,key]);
 return s?h(Fragment,null,h(Badge,{live:s.live}),children(s.d)):D('card sk');}

 return D('chart',h('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':series.map(s=>(s.n||'')+': '+s.d.join(', ')).join('; '),onPointerMove:e=>{const r=e.currentTarget.getBoundingClientRect();setI(Math.max(0,Math.min(n-1,Math.round(((e.clientX-r.left)/r.width*W-p)/((W-2*p)/(n-1))))))},onPointerLeave:()=>setI(null)},
  series.map((s,k)=>h('path',{key:k,d:s.d.map((v,j)=>(j?'L':'M')+X(j)+' '+Y(v)).join(''),fill:'none',stroke:s.c,strokeWidth:3,strokeLinejoin:'round',strokeDasharray:s.dash})),
  i!=null&&h('line',{x1:X(i),x2:X(i),y1:8,y2:H-p,stroke:'#888',strokeDasharray:'3'}),
  i!=null&&series.map((s,k)=>h('circle',{key:k,cx:X(i),cy:Y(s.d[i]),r:5,fill:s.c}))),
  D('tip',i==null?'Hover or touch the chart':labels[i]+' · '+series.map(s=>(s.n?s.n+' ':'')+s.d[i]+unit).join(' · ')),
  D('xl',labels.map(l=>h('span',{key:l},l))));}
function Bars({v,labels,colors,max=100,unit=''}){return D('bars',v.map((x,i)=>h('div',{key:i,className:'bcol',title:labels[i]+': '+x+unit},h('span',null,x+unit),h('i',{style:{height:(x/max*100)+'%',background:colors[i]||'#16a34a'}}),h('small',null,labels[i]))));}
function FieldMap({g,sel,setSel}){return h('div',{className:'map',role:'group','aria-label':'Field zones coloured by NDVI'},g.map((v,i)=>h('button',{key:i,className:'cell'+(sel===i?' on':''),style:{background:ncol(v)},'aria-label':'Zone '+(i+1)+' NDVI '+v,title:'Zone '+(i+1)+' · NDVI '+v,onClick:()=>setSel&&setSel(i)})),h('div',{className:'scan'}));}
const Legend=()=>D('leg',[['#dc2626','<0.30 stressed'],['#f97316','0.30–0.45 low'],['#eab308','0.45–0.60 moderate'],['#65a30d','0.60–0.72 good'],['#14532D','>0.72 dense']].map(x=>h('span',{key:x[0]},h('i',{style:{background:x[0]}}),x[1])));
const Note=({children})=>h('p',{style:{color:'var(--mut)',fontSize:'.85em'}},children);

/* ===== landing ===== */
function Landing(){
 const[t,setT]=useState({x:0,y:0}),cells=Array.from({length:32},(_,i)=>nd(1,2,i));
 const F=[['🛰️','NDVI Monitoring','Zone-by-zone vegetation health from satellite bands (Sentinel-2 integration-ready).'],['🦠','Disease Forecasting','5–7 day blight early-warning from weather, NDVI trend and crop stage.'],['🌾','Yield Prediction','Harvest range with contributing factors, ready for a trained model.'],['💧','Smart Irrigation','Weather-aware watering schedule with sensor support.'],['🤝','Market & Buyers','Compare prices, list produce, send enquiries.']];
 const A=[['1 Data','Sentinel-2 · IMD · INSAT-3D · Bhuvan · Open-Meteo · Farmer input','#bfdbfe'],['2 Ingestion','Cloud masking, resampling, features','#fde68a'],['3 Intelligence','NDVI · Blight · Yield · NLP','#bbf7d0'],['4 Backend','FastAPI · Celery · File storage','#ddd6fe'],['5 Delivery','Telegram bot · Web dashboard','#fecaca']];
 return h(Fragment,null,
